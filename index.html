d:#242032;border-radius:0 9px 9px 0}@media(max-width:560px){.detail{grid-template-columns:95px 1fr;gap:12px}.detail .poster{max-width:95px}.shell{padding:18px 13px 90px}.hero h2{font-size:25px}.modal-inner{padding:15px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

portant;display:flex!important;align-items:center!important;justify-content:center!important;z-index:5!important;box-shadow:0 3px 12px #000c!important}.search-tile .search-plus.is-saved{background:#16834f!important;font-size:23px!important;opacity:1}.search-tile .search-plus:focus-visible{outline:3px solid white;outline-offset:2px}</style></head><body><div class="shell"><header><div><div class="eyebrow">YOUR PERSONAL TV COLLECTION</div><h1>▶ My TV Tracker</h1></div><button class="btn alt tiny" id="settingsBtn">⚙ Settings</button></header><nav class="tabs" id="tabs"><button data-tab="home" class="active">Home</button><button data-tab="discover">Discover</button><button data-tab="archive">Rediscover</button><button data-tab="shows">My Shows</button><button data-tab="upcoming">Upcoming</button><button data-tab="lists">Lists</button><button data-tab="stats">Stats</button></nav><main id="main"></main><footer class="footer">TV information and images provided by <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a>. This product uses the TMDB API but is not endorsed or certified by TMDB. Your tracking data is saved locally in this browser.</footer></div><div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-inner"><button class="btn alt tiny close" id="closeModal">✕ Close</button><div id="modalContent"></div></div></div><script>
'use strict';const K='mytv-v1',API='https://api.themoviedb.org/3',IMG='https://image.tmdb.org/t/p/w342';let db=load(),tab='home',filter='All',searchResults=[],searchText='',searchError='',detailCache={},archiveResults=[],archivePage=1,archiveDecade='2000',archiveCountry='US',archiveGenre='',archiveStatus='all',archiveBusy=false;function load(){try{return Object.assign({key:'',shows:{},lists:[]},JSON.parse(localStorage.getItem(K)||'{}'))}catch{return {key:'',shows:{},lists:[]}}}function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch{alert('Browser storage is full or unavailable. Export a backup from Settings.')}}const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),poster=p=>p?IMG+p:'',pic=(p,alt='TV poster')=>p?`<img class="poster" src="${poster(p)}" alt="${esc(alt)}" loading="lazy">`:'<div class="poster placeholder">No poster</div>',shows=()=>Object.values(db.shows),idkey=(s,e)=>`${s}:${e}`,watched=x=>Object.values(x.watched||{}).filter(Boolean).length,total=x=>Object.values(x.seasons||{}).reduce((n,s)=>n+s.length,0),percent=x=>total(x)?Math.round(100*watched(x)/total(x)):0,fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'TBA';function api(path){if(!db.key)throw Error('Add your free TMDB API Read Access Token in Settings first.');return fetch(API+path+(path.includes('?')?'&':'?')+'language=en-US',{headers:{Authorization:'Bearer '+db.key}}).then(async r=>{if(!r.ok)throw Error(r.status===401?'TMDB token not accepted. Check Settings.':`TMDB request failed (${r.status}).`);return r.json()})}function setTab(t){tab=t;$('#tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}$('#tabs').onclick=e=>{let b=e.target.closest('button[data-tab]');if(b)setTab(b.dataset.tab)};$('#settingsBtn').onclick=settings;$('#closeModal').onclick=close;$('#modal').onclick=e=>{if(e.target.id==='modal')close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});function modal(html){$('#modalContent').innerHTML=html;$('#modal').classList.remove('hidden')}function close(){$('#modal').classList.add('hidden');$('#modalContent').innerHTML=''}function card(x){let saved=!!db.shows[x.id];return `<article class="tile"><div class="poster-wrap"><button class="poster-open" data-detail="${x.id}" aria-label="View ${esc(x.name)} details">${pic(x.poster_path||x.poster,x.name)}</button><button class="poster-quick ${saved?'is-saved':''}" data-quick-add="${x.id}" aria-label="${saved?'Already in My Shows':'Quick add '+esc(x.name)}" title="${saved?'In My Shows':'Quick add to My Shows'}" ${saved?'disabled':''}>${saved?'✓':'+'}</button></div><h3>${esc(x.name)}</h3><p>${esc((x.first_air_date||'').slice(0,4))} ${saved?'· '+esc(db.shows[x.id].status):''}</p><button class="btn tiny" data-detail="${x.id}">${saved?'View show':'View / Add'}</button></article>`}function searchCard(x){let saved=!!db.shows[x.id];return `<article class="tile search-tile"><div class="search-poster"><button type="button" class="poster-open" data-detail="${x.id}" aria-label="View ${esc(x.name)} details">${pic(x.poster_path||x.poster,x.name)}</button><button type="button" class="search-plus ${saved?'is-saved':''}" data-quick-add="${x.id}" aria-label="${saved?'Already added':'Add '+esc(x.name)+' to My Shows'}" title="${saved?'Added to My Shows':'Quick add to My Shows'}" ${saved?'disabled':''}>${saved?'✓':'+'}</button></div><h3>${esc(x.name)}</h3><p>${esc((x.first_air_date||'').slice(0,4))}${saved?' · Added':''}</p></article>`}function render(){let m=$('#main');if(tab==='home'){let a=shows(),current=a.filter(x=>x.status==='Watching');m.innerHTML=`<div class="panel hero"><div class="eyebrow">Welcome back</div><h2>Your next episode awaits.</h2><p>Keep every show, season and episode in one place.</p><button class="btn" data-go="discover">+ Find a show</button></div><div class="stats"><div class="stat"><strong>${a.length}</strong><span>Shows saved</span></div><div class="stat"><strong>${a.reduce((n,x)=>n+watched(x),0)}</strong><span>Episodes watched</span></div><div class="stat"><strong>${current.length}</strong><span>Currently watching</span></div></div><section class="section"><h2>Continue watching</h2>${current.length?`<div class="grid">${current.map(card).join('')}</div>`:'<div class="empty">Nothing here yet. Search for a show to begin.</div>'}</section><section class="section"><h2>Recently added</h2><div class="grid">${a.slice().sort((a,b)=>b.added-a.added).slice(0,6).map(card).join('')}</div></section>`}else if(tab==='discover'){m.innerHTML=`<h2>Discover TV</h2><p>Search the TMDB catalogue to find your next show.</p><form id="searchForm" class="row"><input class="field" style="flex:1;min-width:170px;margin:0" id="searchInput" placeholder="Search for a TV show…" value="${esc(searchText)}" required><button class="btn" type="submit">Search</button></form>${!db.key?'<p class="notice">To search, open Settings and add your free TMDB API Read Access Token.</p>':''}${searchError?`<p class="error">${esc(searchError)}</p>`:''}<div class="grid section">${searchResults.map(searchCard).join('')}</div>`;$('#searchForm').onsubmit=async e=>{e.preventDefault();searchText=$('#searchInput').value.trim();if(!searchText)return;searchError='';m.insertAdjacentHTML('beforeend','<p id="loading">Searching…</p>');try{searchResults=(await api('/search/tv?query='+encodeURIComponent(searchText)+'&include_adult=false')).results||[]}catch(err){searchError=err.message;searchResults=[]}render()}}else if(tab==='archive'){m.innerHTML=`<div class="panel hero"><div class="eyebrow">Your lifetime TV archive</div><h2>Rediscover the shows you remember.</h2><p>Browse every decade, with 2000s onward as your starting point. US and UK first, with worldwide discovery too. Save older shows without guessing episode counts.</p></div><div class="panel"><div class="row"><label>Decade<select class="field" id="archiveDecade"><option value="all" ${archiveDecade==='all'?'selected':''}>All decades</option>${['1950','1960','1970','1980','1990','2000','2010','2020'].map(y=>`<option value="${y}" ${archiveDecade===y?'selected':''}>${y}s</option>`).join('')}</select></label><label>Origin<select class="field" id="archiveCountry">${[['US','United States'],['GB','United Kingdom'],['all','Worldwide']].map(([v,t])=>`<option value="${v}" ${archiveCountry===v?'selected':''}>${t}</option>`).join('')}</select></label><label>Genre<select class="field" id="archiveGenre">${[['','All genres'],['18','Drama'],['35','Comedy'],['80','Crime'],['10765','Sci-fi & fantasy'],['9648','Mystery'],['10759','Action & adventure'],['10764','Reality'],['10766','Soap'],['10751','Family'],['99','Documentary']].map(([v,t])=>`<option value="${v}" ${archiveGenre===v?'selected':''}>${t}</option>`).join('')}</select></label><label>Show status<select class="field" id="archiveStatus">${[['all','All'],['ended','Ended / concluded'],['canceled','Cancelled'],['returning','Returning']].map(([v,t])=>`<option value="${v}" ${archiveStatus===v?'selected':''}>${t}</option>`).join('')}</select></label></div><button class="btn" id="archiveFind">Browse shows</button><p class="notice">Results are from TMDB. Status labels depend on TMDB records. Shows that began before 2000 remain discoverable through All decades or their original decade. Search by name in Discover at any time.</p></div>${archiveResults.length?`<h3>Archive results</h3><div class="grid">${archiveResults.map(searchCard).join('')}</div><p><button class="btn alt" id="archiveMore" ${archiveBusy?'disabled':''}>Load more</button></p>`:'<div class="empty">Choose your filters and tap Browse shows to start rediscovering.</div>'}`;$('#archiveFind').onclick=()=>archiveFetch(true);if($('#archiveMore'))$('#archiveMore').onclick=()=>archiveFetch(false)}else if(tab==='shows'){let a=shows().filter(x=>filter==='All'||x.status===filter);m.innerHTML=`<h2>My Shows <small>(${shows().length})</small></h2><div class="chips">${['All','Watching','Want to Watch','Completed','On Hold','Dropped'].map(s=>`<button data-filter="${esc(s)}" class="${filter===s?'active':''}">${s}</button>`).join('')}</div>${a.length?`<div class="grid">${a.map(card).join('')}</div>`:'<div class="empty">No shows in this category yet.</div>'}`}else if(tab==='upcoming'){let ev=[];for(let x of shows())for(let [s,eps] of Object.entries(x.seasons||{}))for(let e of eps)if(e.air_date&&e.air_date>=new Date().toISOString().slice(0,10)&&!x.watched[idkey(s,e.episode_number)])ev.push({x,s,e});ev.sort((a,b)=>a.e.air_date.localeCompare(b.e.air_date));m.innerHTML=`<h2>Upcoming episodes</h2><p>Known future air dates for shows in your collection. Open a show to refresh its season information.</p>${ev.length?ev.slice(0,60).map(({x,s,e})=>`<div class="upcoming"><strong>${esc(x.name)}</strong> · S${s} E${e.episode_number}<br>${esc(e.name)}<br><small>${fmt(e.air_date)}</small></div>`).join(''):'<div class="empty">No upcoming episodes found in your saved show data.</div>'}`}else if(tab==='lists'){m.innerHTML=`<h2>Custom collections</h2><form id="listForm" class="row"><input id="listName" class="field" style="flex:1;min-width:170px;margin:0" placeholder="e.g. Comfort shows" maxlength="60" required><button class="btn">Create list</button></form>${db.lists.map(l=>`<div class="panel"><div class="row between"><h3>${esc(l.name)} <small>(${l.ids.length})</small></h3><button class="btn alt tiny" data-delete-list="${l.id}">Delete</button></div>${l.ids.map(id=>db.shows[id]?`<div class="listrow">${db.shows[id].poster?`<img src="${poster(db.shows[id].poster)}" alt="">`:''}<div class="grow"><strong>${esc(db.shows[id].name)}</strong></div><button class="btn tiny alt" data-detail="${id}">Open</button></div>`:'').join('')||'<p>No shows yet. Add them from a show page.</p>'}</div>`).join('')}`;$('#listForm').onsubmit=e=>{e.preventDefault();let name=$('#listName').value.trim();if(name){db.lists.push({id:String(Date.now()),name,ids:[]});save();render()}}}else if(tab==='stats'){let a=shows(),ratings=a.filter(x=>x.rating>0);m.innerHTML=`<h2>Your watching statistics</h2><div class="stats"><div class="stat"><strong>${a.length}</strong><span>Total shows</span></div><div class="stat"><strong>${a.reduce((n,x)=>n+watched(x),0)}</strong><span>Episodes watched</span></div><div class="stat"><strong>${a.filter(x=>x.status==='Completed').length}</strong><span>Completed shows</span></div><div class="stat"><strong>${ratings.length?(ratings.reduce((n,x)=>n+Number(x.rating),0)/ratings.length).toFixed(1):'—'}</strong><span>Average rating / 10</span></div></div><div class="panel"><h3>By watch status</h3>${['Watching','Want to Watch','Completed','On Hold','Dropped'].map(s=>`<div class="row between"><span>${s}</span><strong>${a.filter(x=>x.status===s).length}</strong></div>`).join('')}</div><div class="panel"><h3>Lifetime archive</h3><div class="row between"><span>Shows with historical viewing recorded</span><strong>${a.filter(x=>x.history).length}</strong></div><div class="row between"><span>Entire series remembered</span><strong>${a.filter(x=>x.history==='all').length}</strong></div><div class="row between"><span>Watched, amount unknown</span><strong>${a.filter(x=>x.history==='unsure').length}</strong></div><h3>Shows by premiere decade</h3>${[1950,1960,1970,1980,1990,2000,2010,2020].map(y=>`<div class="row between"><span>${y}s</span><strong>${a.filter(x=>Number((x.first_air_date||'').slice(0,4))>=y&&Number((x.first_air_date||'').slice(0,4))<y+10).length}</strong></div>`).join('')}<p><small>Decades refer to premiere dates, not the years you watched.</small></p></div><div class="panel"><h3>Episodes by show</h3>${a.filter(x=>total(x)).sort((a,b)=>watched(b)-watched(a)).map(x=>`<div class="row between"><span>${esc(x.name)}</span><small>${watched(x)}/${total(x)} · ${percent(x)}%</small></div><div class="progress"><div style="width:${percent(x)}%"></div></div>`).join('')||'<p>Start tracking episodes to see progress.</p>'}</div>`}}$('#main').onclick=e=>{let quick=e.target.closest('[data-quick-add]');if(quick){e.preventDefault();e.stopPropagation();let id=Number(quick.dataset.quickAdd);if(db.shows[id])return;let x=[...searchResults,...archiveResults,...shows()].find(x=>Number(x.id)===id);if(!x)return;db.shows[id]={id,name:x.name,poster:x.poster_path||x.poster||'',first_air_date:x.first_air_date||'',tmdbStatus:x.tmdbStatus||x.status||'',runtime:x.runtime||0,number_of_episodes:x.number_of_episodes||0,rewatch:false,status:'Unassigned',platform:'',rating:0,review:'',watched:{},seasons:{},added:Date.now(),history:'',historyWhen:'',historyNotes:'',historySeasons:[],origin_country:x.origin_country||[],original_language:x.original_language||''};save();render();return}let d=e.target.closest('[data-detail]'),g=e.target.closest('[data-go]'),f=e.target.closest('[data-filter]'),del=e.target.closest('[data-delete-list]');if(d)openShow(Number(d.dataset.detail));if(g)setTab(g.dataset.go);if(f){filter=f.dataset.filter;render()}if(del&&confirm('Delete this collection?')){db.lists=db.lists.filter(l=>l.id!==del.dataset.deleteList);save();render()}};async function archiveFetch(reset){archiveDecade=$('#archiveDecade').value;archiveCountry=$('#archiveCountry').value;archiveGenre=$('#archiveGenre').value;archiveStatus=$('#archiveStatus').value;if(reset){archivePage=1;archiveResults=[]}if(archiveBusy)return;archiveBusy=true;let b=$('#archiveFind');b.disabled=true;b.textContent='Finding shows…';try{let params=new URLSearchParams({sort_by:'popularity.desc',page:String(archivePage),include_adult:'false'});if(archiveDecade!=='all'){params.set('first_air_date.gte',archiveDecade+'-01-01');params.set('first_air_date.lte',(Number(archiveDecade)+9)+'-12-31')}if(archiveCountry!=='all')params.set('with_origin_country',archiveCountry);if(archiveGenre)params.set('with_genres',archiveGenre);if(archiveStatus!=='all')params.set('with_status',archiveStatus);let data=await api('/discover/tv?'+p function renderArchive(m){m.innerHTML=`<div class="panel hero"><div class="eyebrow">Your lifetime TV archive</div><h2>Rediscover what you watched.</h2><p>Browse any decade, with 2000s onward as the starting point. Add shows you remember watching, even if you cannot recall every episode.</p></div><div class="panel"><div class="archive-filters">${archiveSelect('decade',[['all','All decades'],...Array.from({length:9},(_,i)=>[String(1950+i*10),String(1950+i*10)+'s'])])}${archiveSelect('country',[['US','United States'],['GB','United Kingdom'],['all','All countries']])}${archiveSelect('language',[['en','English original language'],['all','All languages']])}${archiveSelect('status',[['all','All statuses'],['ended','Ended (includes many cancelled shows)'],['returning','Returning series']])}${archiveSelect('genre',ARCHIVE_GENRES)}${archiveSelect('network',ARCHIVE_NETWORKS)}${archiveSelect('sort',ARCHIVE_SORTS)}</div><button class="btn" id="browseArchive" ${archiveBusy?'disabled':''}>${archiveBusy?'Loading…':'Browse shows'}</button><p><small>TMDB does not reliably distinguish cancelled from naturally concluded series. “Ended” includes both. Sorting applies across TMDB discovery pages; this is not a complete historical index. Shows that began before a selected decade but continued into it may be found via All decades or search.</small></p></div>${archiveError?`<p class="error">${esc(archiveError)}</p>`:''}<div class="row between section"><h2>Browse results</h2><small>Page ${archivePage} of ${archivePages}</small></div>${archiveResults.length?`<div class="grid">${archiveResults.map(searchCard).join('')}</div><div class="row section"><button class="btn alt" id="archiveMore" ${archiveBusy||archivePage>=archivePages?'disabled':''}>${archiveBusy?'Loading…':'Load more'}</button></div>`:'<div class="empty">Choose your filters and tap Browse shows.</div>'}`;m.querySelectorAll('[data-archive]').forEach(el=>el.onchange=()=>{archiveFilters[el.dataset.archive]=el.value});$('#browseArchive async function fetchArchive(more){if(archiveBusy)return;archiveBusy=true;archiveError='';if(!more){archivePage=1;archiveResults=[]}render();try{let f=archiveFilters,q=new URLSearchParams({sort_by:f.sort,include_adult:'false',page:String(archivePage),watch_region:'GB'});if(f.decade!=='all'){q.set('first_air_date.gte',f.decade+'-01-01');q.set('first_air_date.lte',String(Number(f.decade)+9)+'-12-31')}if(f.country!=='all')q.set('with_origin_country',f.country);if(f.language!=='all')q.set('with_original_language',f.language);if(f.status==='ended')q.set('with_status','3');if(f.status==='returning')q.set('with_status','0');if(f.genre)q.set('with_genres',f.genre);if(f.sort==='vote_average.desc')q.set('vote_count.gte','50');if(f.network)q.set('with_networks',f.network);let data=await api('/discover/tv?'+q.toString());archiveResults=more?[...archiveResults,...(data.results||[])]:data.results||[];archivePages=Math.min(data.total_pages||1,500)}catch(e){archiveError=e.message;if(more)archivePage--}finally{archiveBusy=false;render()}}

if(tab==='shows'){let b=a.filter(x=>(filter==='All'||x.status===filter)&&(platformFilter==='All'||(x.platform||'Not set')===platformFilter));m.innerHTML=`<h2>My Shows <small>(${a.length})</small></h2><div class="chips">${['All','Watching','Want to Watch','Completed','On Hold','Dropped'].map(z=>`<button data-filter="${z}" class="${filter===z?'active':''}">${z}</button>`).join('')}</div><label>Streaming platform<select id="platformFilter" class="field"><option>All</option>${PLATFORM_OPTIONS.map(z=>`<option ${platformFilter===z?'selected':''}>${z}</option>`).join('')}</select></label>${b.length?`<div class="grid">${b.map(card).join('')}</div>`:'<div class="empty">No shows match these filters.</div>'}`;$('#platformFilter').onchange=e=>{platformFilter=e.target.value;render()};return}
let mins=viewingMinutes();m.innerHTML=`<h2>Your TV statistics</h2><div class="stats"><div class="stat"><strong>${a.length}</strong><span>Shows saved</span></div><div class="stat"><strong>${a.reduce((n,x)=>n+watched(x),0)}</strong><span>Episodes checked</span></div><div class="stat"><strong>${(mins/60).toFixed(1)}</strong><span>Confirmed hours watched</span></div><div class="stat"><strong>${a.filter(x=>x.rewatch).length}</strong><span>Rewatch list</span></div></div><p class="notice">Hours use TMDB episode runtimes (or known series runtimes) for episodes you've checked off. Shows marked Completed without individual episode checks aren't included, so your lifetime total may be higher.</p><div class="panel"><h3>My collection</h3>${['Watching','Want to Watch','Completed','On Hold','Dropped'].map(z=>`<div class="row between"><span>${z}</span><strong>${a.filter(x=>x.status===z).length}</strong></div>`).join('')}</div><div class="panel"><h3>Streaming platforms</h3>${PLATFORM_OPTIONS.filter(z=>a.some(x=>(x.platform||'Not set')===z)).map(z=>`<div class="row between"><span>${z}</span><strong>${a.filter(x=>(x.platform||'Not set')===z).length}</strong></div>`).join('')}</div>`};
controls=function(d,x){return `<section class="section"><div class="stats"><div class="stat"><strong>${percent(x)}%</strong><span>Loaded episodes checked</span></div><div class="stat"><strong>${watched(x)}/${total(x)}</strong><span>Episodes checked / loaded</span></div></div><div class="progress"><div style="width:${percent(x)}%"></div></div><label>My watch status<select id="status" class="field">${['Watching','Want to Watch','Completed','On Hold','Dropped'].map(z=>`<option ${x.status===z?'selected':''}>${z}</option>`).join('')}</select></label><label>Streaming platform<select id="platform" class="field">${PLATFORM_OPTIONS.filter(z=>z!=='Not set').map(z=>`<option value="${esc(z)}" ${x.platform===z?'selected':''}>${esc(z)}</option>`).join('')}<option value="" ${!x.platform?'selected':''}>Not set</option></select></label><label>My rating<select id="rating" class="field"><option value="0">Not rated</option>${Array.from({length:10},(_,i)=>`<option value="${i+1}" ${Number(x.rating)===i+1?'selected':''}>${i+1}/10</option>`).join('')}</select></label><label class="rewatchcheck"><input type="checkbox" id="rewatch" ${x.rewatch?'checked':''}> Add to Rewatch list</label><p><span class="seriesbadge">TMDB: ${esc(seriesStatus(d.status||x.tmdbStatus))}</span></p><button class="btn" id="saveDetails">Save changes</button><h3 class="section">Custom collections</h3><div class="checklist">${db.lists.map(l=>`<label><input type="checkbox" data-list="${l.id}" ${l.ids.includes(x.id)?'checked':''}> ${esc(l.name)}</label>`).join('')||'<p>Create a collection in Lists.</p>'}</div><h3 class="section">Seasons & episodes</h3><p>Load a season to tick off episodes. You can also mark a whole season watched.</p>${(d.seasons||[]).filter(z=>z.season_number>0).map(z=>`<div class="panel"><div class="row between"><strong>${esc(z.name)} <small>(${z.episode_count} episodes)</small></strong><button class="btn tiny alt" data-season="${z.season_number}">${x.seasons[z.season_number]?'Refresh':'Load episodes'}</button></div><div id="season-${z.season_number}">${x.seasons[z.season_number]?episodeHTML(x,z.season_number):''}</div></div>`).join('')}<button class="btn outline" id="removeShow">Remove show from tracker</button></section>`};
wireControls=function(d,x){$('#saveDetails').onclick=()=>{x.status=$('#status').value;x.platform=$('#platform').value;x.rating=Number($('#rating').value);x.rewatch=$('#rewatch').checked;x.tmdbStatus=d.status||x.tmdbStatus;x.runtime=(d.episode_run_time||[])[0]||d.last_episode_to_air?.runtime||x.runtime||0;save();showDetail(d);render()};$('#showControls').onchange=e=>{let l=e.target.dataset.list,ep=e.target.dataset.ep;if(l){let list=db.lists.find(z=>z.id===l);if(list){list.ids=e.target.checked?[...new Set([...list.ids,x.id])]:list.ids.filter(id=>id!==x.id);save()}}if(ep){x.watched[ep]=e.target.checked;save();let scroll=$('#modal').scrollTop;showDetail(d);$('#modal').scrollTop=scroll;render()}};$('#showControls').onclick=async e=>{let z=e.target.closest('[data-season]'),all=e.target.closest('[data-all]');if(z){let n=Number(z.dataset.season);z.disabled=true;z.textContent='Loading…';try{let data=await api('/tv/'+d.id+'/season/'+n);x.seasons[n]=(data.episodes||[]).map(e=>({episode_number:e.episode_number,name:e.name,air_date:e.air_date,overview:e.overview,runtime:e.runtime}));save();let scroll=$('#modal').scrollTop;showDetail(d);$('#modal').scrollTop=scroll;render()}catch(err){alert(err.message);z.disabled=false;z.textContent='Try again'}}if(all){let n=Number(all.dataset.all);for(let e of x.seasons[n]||[])x.watched[idkey(n,e.episode_number)]=true;save();let scroll=$('#modal').scrollTop;showDetail(d);$('#modal').scrollTop=scroll;render()}};$('#removeShow').onclick=()=>{if(confirm('Remove this show and its saved episode progress?')){delete db.shows[x.id];db.lists.forEach(l=>l.ids=l.ids.filter(id=>id!==x.id));save();close();render()}}};
$('#tabs').insertAdjacentHTML('beforeend','<button data-tab="rewatch">Rewatch</button>');


/* V3.1: fast show entry, synopsis on demand. Existing local storage is unchanged. */
const previousControls=controls;
controls=function(d,x){return previousControls(d,x).replace('<select id="status" class="field">','<select id="status" class="field"><option value="Unassigned" '+(x.status==='Unassigned'?'selected':'')+'>Choose later</option>')};
showDetail=function(d){
 const x=db.shows[d.id],providers=d['watch/providers']?.results?.GB?.flatrate||[];
 modal(`<div class="detail">${pic(d.poster_path,d.name)}<div><div class="eyebrow">${esc(d.first_air_date?.slice(0,4)||'TV series')} · ${d.number_of_seasons||0} seasons</div><h2>${esc(d.name)}</h2><p><span class="seriesbadge">${esc(seriesStatus(d.status))}</span></p><small>${esc((d.genres||[]).map(g=>g.name).join(' · '))}</small><div style="margin:14px 0">${!x?'<button class="btn" id="addShow">+ Quick add to My Shows</button><p><small>Save now; choose your watch status later.</small></p>':'<span class="eyebrow">✓ In your collection</span>'}</div></div></div><div id="showControls">${x?controls(d,x):''}</div><details class="panel section"><summary style="cursor:pointer;font-weight:700;padding:8px 0">About this show · Read description</summary><p>${esc(d.overview||'No synopsis available.')}</p><p><small>Streaming in UK (TMDB): ${esc(providers.map(p=>p.provider_name).join(', ')||'Not listed')}</small></p></details>`);
 if(!x)$('#addShow').onclick=()=>{db.shows[d.id]={id:d.id,name:d.name,poster:d.poster_path,first_air_date:d.first_air_date,tmdbStatus:d.status||'',runtime:(d.episode_run_time||[])[0]||d.last_episode_to_air?.runtime||0,number_of_episodes:d.number_of_episodes||0,rewatch:false,status:'Unassigned',platform:'',rating:0,review:'',watched:{},seasons:{},added:Date.now(),history:'',historyWhen:'',historyNotes:'',historySeasons:[],origin_country:d.origin_country||[],original_language:d.original_language||''};save();showDetail(d);render()};else wireControls(d,x);
};


/* V3.2: bulk completion, dedicated Completed tab, compact episode listings. */
const v32Controls=controls, v32Wire=wireControls, v32Render=render, v32EpisodeHTML=episodeHTML;
const aired=e=>!e.air_date||e.air_date<=new Date().toISOString().slice(0,10);
function markLoadedSeason(x,n,flag){for(const e of x.seasons[n]||[])if(aired(e))x.watched[idkey(n,e.episode_number)]=flag;}
async function loadSeasonForCompletion(d,x,n){if(!x.seasons[n]){let data=await api('/tv/'+d.id+'/season/'+n);x.seasons[n]=(data.episodes||[]).map(e=>({episode_number:e.episode_number,name:e.name,air_date:e.air_date,overview:e.overview,runtime:e.runtime}));}markLoadedSeason(x,n,true);}
async function completeSeries(d,x){const nums=(d.seasons||[]).filter(z=>z.season_number>0&&(!z.air_date||z.air_date<=new Date().toISOString().slice(0,10))).map(z=>z.season_number);for(const n of nums)await loadSeasonForCompletion(d,x,n);x.status='Completed';x.runtime=(d.episode_run_time||[])[0]||d.last_episode_to_air?.runtime||x.runtime||0;save();}
episodeHTML=function(x,n){let eps=x.seasons[n]||[],count=eps.filter(e=>x.watched[idkey(n,e.episode_number)]).length;return `<div class="row between"><small>${count}/${eps.length} watched</small><button class="btn tiny alt" data-all="${n}">Mark season watched</button></div>${eps.map(e=>`<div class="episode"><input type="checkbox" id="ep-${n}-${e.episode_number}" data-ep="${n}:${e.episode_number}" ${x.watched[idkey(n,e.episode_number)]?'checked':''}><label for="ep-${n}-${e.episode_number}"><strong>${e.episode_number}. ${esc(e.name||'Episode '+e.episode_number)}</strong></label>${e.overview?`<details style="flex-basis:100%;margin-left:30px"><summary style="cursor:pointer;color:#bdb2d0;font-size:12px">Episode details</summary><p>${esc(e.overview)}</p></details>`:''}</div>`).join('')}`};
controls=function(d,x){let html=v32Controls(d,x);html=html.replace('<h3 class="section">Seasons & episodes</h3>',`<div class="panel"><h3>Quick completion</h3><button class="btn" id="completeSeries">✓ Mark entire show watched</button><p><small>Loads all released regular seasons, marks their aired episodes watched and moves this show to Completed. Future episodes stay unwatched.</small></p></div><h3 class="section">Seasons & episodes</h3>`);html=html.replace(/<button class="btn tiny alt" data-season="(\d+)">/g,`<button class="btn tiny alt" data-season="$1">`);html=html.replace(/(<button class="btn tiny alt" data-season="(\d+)">(?:Refresh|Load episodes)<\/button>)/g,'$1 <button class="btn tiny alt" data-complete-season="$2">✓ Season watched</button>');return html;};
wireControls=function(d,x){v32Wire(d,x);const wrap=$('#showControls');wrap.addEventListener('click',async e=>{let season=e.target.closest('[data-complete-season]'),whole=e.target.closest('#completeSeries');if(!season&&!whole)return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();const btn=season||whole;btn.disabled=true;btn.textContent='Saving watched episodes…';try{if(whole){await completeSeries(d,x)}else{await loadSeasonForCompletion(d,x,Number(season.dataset.completeSeason));save()}let pos=$('#modal').scrollTop;showDetail(d);$('#modal').scrollTop=pos;render()}catch(err){alert('Could not finish marking episodes: '+err.message+' Please try again.');btn.disabled=false;btn.textContent=whole?'✓ Mark entire show watched':'✓ Season watched'}},true);
$('#saveDetails').addEventListener('click',async e=>{if($('#status').value!=='Completed')return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();let btn=e.target;btn.disabled=true;btn.textContent='Completing all seasons…';try{await completeSeries(d,x);x.platform=$('#platform').value;x.rating=Number($('#rating').value);x.rewatch=$('#rewatch').checked;save();showDetail(d);render()}catch(err){alert('Could not complete all seasons: '+err.message);btn.disabled=false;btn.textContent='Save changes'}},true);
};
$('#tabs').insertAdjacentHTML('beforeend','<button data-tab="completed">Completed</button>');
render=function(){if(tab==='completed'){let a=shows().filter(x=>x.status==='Completed');$('#main').innerHTML=`<h2>✓ Completed <small>(${a.length})</small></h2><p>Shows you have finished watching. New episodes of returning shows are not automatically checked off.</p>${a.length?`<div class="grid">${a.map(card).join('')}</div>`:'<div class="empty">Mark an entire show watched to add it here.</div>'}`;return}v32Render()};


/* V3.5: metadata sorting, animation, and collection ordering. */
const ARCHIVE_SORTS=[['popularity.desc','Popularity'],['name.asc','Title A–Z'],['name.desc','Title Z–A'],['first_air_date.desc','Premiere: newest first'],['first_air_date.asc','Premiere: oldest first'],['vote_average.desc','TMDB rating']];
let archiveFilters={decade:'2000',country:'US',language:'en',status:'all',genre:'',network:'',sort:'popularity.desc'},archivePages=1,archiveError='',mySort='az',searchSort='relevance';
const v35PreviousRender=render;
function sortedShows(items,mode){return items.slice().sort((a,b)=>{let title=(a.name||'').localeCompare(b.name||'',undefined,{sensitivity:'base',ignorePunctuation:true});if(mode==='az')return title;if(mode==='za')return -title;if(mode==='new')return (b.first_air_date||'').localeCompare(a.first_air_date||'')||title;if(mode==='old')return (a.first_air_date||'9999').localeCompare(b.first_air_date||'9999')||title;if(mode==='added')return (b.added||0)-(a.added||0)||title;if(mode==='rating')return (Number(b.rating)||0)-(Number(a.rating)||0)||title;if(mode==='progress')return percent(b)-percent(a)||title;if(mode==='tmdb')return (Number(b.vote_average)||0)-(Number(a.vote_average)||0)||title;return 0})}
const MY_SORTS=[['az','Title A–Z'],['za','Title Z–A'],['new','Premiere: newest first'],['old','Premiere: oldest first'],['added','Recently added'],['rating','My rating'],['progress','Episode progress']];
function sortSelect(id,opts,val){return `<label>Sort by<select id="${id}" class="field">${opts.map(([v,t])=>`<option value="${v}" ${val===v?'selected':''}>${t}</option>`).join('')}</select></label>`}
render=function(){
 if(tab==='archive'){renderArchive($('#main'));return}
 if(tab==='shows'||tab==='completed'){
  let all=shows(),items=all.filter(x=>(tab==='completed'?x.status==='Completed':(filter==='All'||x.status===filter))&&(platformFilter==='All'||(x.platform||'Not set')===platformFilter));
  $('#main').innerHTML=`<h2>${tab==='completed'?'✓ Completed':'My Shows'} <small>(${items.length})</small></h2>${tab==='shows'?`<div class="chips">${['All','Watching','Want to Watch','Completed','On Hold','Dropped'].map(z=>`<button data-filter="${z}" class="${filter===z?'active':''}">${z}</button>`).join('')}</div>`:''}<div class="archive-filters"><label>Streaming platform<select id="platformFilter" class="field"><option>All</option>${PLATFORM_OPTIONS.map(z=>`<option ${platformFilter===z?'selected':''}>${z}</option>`).join('')}</select></label>${sortSelect('mySort',MY_SORTS,mySort)}</div>${items.length?`<div class="grid">${sortedShows(items,mySort).map(card).join('')}</div>`:'<div class="empty">No shows match these filters.</div>'}`;
  $('#platformFilter').onchange=e=>{platformFilter=e.target.value;render()};$('#mySort').onchange=e=>{mySort=e.target.value;render()};return;
 }
 if(tab==='discover'){
  v35PreviousRender();const grid=$('#main .grid.section');if(!grid)return;
  const control=document.createElement('div');control.className='section';control.innerHTML=sortSelect('searchSort',[['relevance','TMDB search relevance'],['az','Title A–Z'],['za','Title Z–A'],['new','Premiere: newest first'],['old','Premiere: oldest first'],['tmdb','TMDB rating']],searchSort)+'<small>Search sorting applies to the results TMDB returned for this search. Rediscover sorts the full catalogue.</small>';
  grid.before(control);grid.innerHTML=(searchSort==='relevance'?searchResults:sortedShows(searchResults,searchSort)).map(searchCard).join('');$('#searchSort').onchange=e=>{searchSort=e.target.value;render()};return;
 }
 v35PreviousRender();
};

/* V3.6: correct archive pagination and animation discovery presets. */
const v36ArchiveRender=renderArchive;
const v36ArchiveFetch=fetchArchive;
const ANIMATION_PRESETS=[['','All animation'],['comedy','Animated comedy'],['family','Family animation'],['kids','Children’s animation'],['action','Animated action & adventure'],['fantasy','Animated sci-fi & fantasy']];
let animationPreset='';
renderArchive=function(m){
 v36ArchiveRender(m);
 const genre=m.querySelector('#archiveGenre');
 if(genre && !Array.from(genre.options).some(o=>o.value==='16'))genre.insertAdjacentHTML('beforeend','<option value="16">Animation</option>');
 if(genre)genre.value=archiveFilters.genre;
 if(archiveFilters.genre==='16'){
  const wrap=document.createElement('label');wrap.textContent='Animation type (approximate)';
  const sel=document.createElement('select');sel.className='field';sel.id='animationPreset';
  sel.innerHTML=ANIMATION_PRESETS.map(([v,t])=>`<option value="${v}" ${animationPreset===v?'selected':''}>${t}</option>`).join('');
  sel.onchange=()=>{animationPreset=sel.value;archivePage=1;archiveResults=[];render()};
  wrap.appendChild(sel);m.querySelector('.archive-filters').appendChild(wrap);
 }
 if(genre)genre.onchange=()=>{archiveFilters.genre=genre.value;animationPreset='';archivePage=1;archiveResults=[];render()};
};
fetchArchive=async function(more){
 if(archiveBusy)return;
 archiveBusy=true;archiveError='';
 const requestedPage=more?archivePage+1:1;
 if(!more){archivePage=1;archiveResults=[]}
 render();
 try{
  const f=archiveFilters,q=new URLSearchParams({sort_by:f.sort,include_adult:'false',page:String(requestedPage),watch_region:'GB'});
  if(f.decade!=='all'){q.set('first_air_date.gte',f.decade+'-01-01');q.set('first_air_date.lte',String(Number(f.decade)+9)+'-12-31')}
  if(f.country!=='all')q.set('with_origin_country',f.country);
  if(f.language!=='all')q.set('with_original_language',f.language);
  if(f.status==='ended')q.set('with_status','3');
  if(f.status==='returning')q.set('with_status','0');
  if(f.genre)q.set('with_genres',f.genre);
  if(f.genre==='16'&&animationPreset){const genreIds={comedy:'35',family:'10751',kids:'10762',action:'10759',fantasy:'10765'};q.set('with_genres','16,'+genreIds[animationPreset])}
  if(f.sort==='vote_average.desc')q.set('vote_count.gte','50');
  if(f.network)q.set('with_networks',f.network);
  const data=await api('/discover/tv?'+q.toString());
  const seen=new Set(more?archiveResults.map(x=>x.id):[]);
  const fresh=(data.results||[]).filter(x=>{if(seen.has(x.id))return false;seen.add(x.id);return true});
  archiveResults=more?[...archiveResults,...fresh]:fresh;
  archivePage=data.page||requestedPage;
  archivePages=Math.min(data.total_pages||1,500);
 }catch(e){archiveError=e.message}
 finally{archiveBusy=false;render()}
};
render();
</script></body></html>
