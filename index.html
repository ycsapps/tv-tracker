<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10111b"><title>My TV Tracker</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#f6f4ff;background:#10111b}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.shell{max-width:1100px;margin:auto;padding:24px 18px 100px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:25px}h1{font-size:27px;margin:0}h2{font-size:21px;margin:8px 0 17px}h3{margin:8px 0}p{color:#b4b0c6;line-height:1.5}.muted,small{color:#aaa5bd}.eyebrow{color:#c9a6ff;font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.btn{border:0;border-radius:12px;padding:11px 15px;background:#a877fa;color:#140d22;font-weight:750}.btn.alt{background:#292638;color:#eee}.btn.outline{background:transparent;color:#d6baff;border:1px solid #665184}.btn.tiny{padding:7px 10px;font-size:12px}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:12px;margin-bottom:12px}.tabs button,.chips button{white-space:nowrap;border:1px solid #383347;border-radius:99px;background:#201e2c;color:#c9c4d5;padding:10px 14px}.tabs button.active,.chips button.active{background:#a877fa;color:#160e25;border-color:#a877fa}.panel{background:#1b1a28;border:1px solid #333044;border-radius:18px;padding:19px;margin:16px 0}.hero{background:linear-gradient(125deg,#39224f,#1b1a28 70%);padding:26px}.hero h2{font-size:30px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:15px}.poster{aspect-ratio:2/3;width:100%;object-fit:cover;border-radius:12px;background:#302a3d}.tile{border:1px solid #383247;background:#1c1a28;border-radius:15px;padding:10px;min-width:0}.tile h3{font-size:14px;line-height:1.35}.tile p{font-size:12px;margin:5px 0}.tile button{width:100%;margin-top:6px}.placeholder{display:grid;place-items:center;color:#9a8da9;background:#302a3d}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.field{display:block;width:100%;padding:12px;background:#11111b;color:#fff;border:1px solid #494155;border-radius:11px;margin:8px 0 13px}textarea.field{min-height:85px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}.stat{background:#242033;border-radius:14px;padding:17px}.stat strong{font-size:28px;display:block}.stat span{font-size:12px;color:#bcb3d0}.detail{display:grid;grid-template-columns:150px 1fr;gap:20px}.detail .poster{max-width:150px}.progress{height:7px;background:#40384c;border-radius:9px;overflow:hidden;margin:10px 0}.progress>div{height:100%;background:#ae7cff}.episode{display:flex;gap:10px;align-items:flex-start;border-top:1px solid #383247;padding:12px 0}.episode input{accent-color:#b58aff;width:20px;height:20px;flex-shrink:0}.episode label{flex:1;cursor:pointer}.episode small{display:block;margin-top:3px}.hidden{display:none!important}.notice{padding:12px;border:1px solid #7a6142;background:#32291e;border-radius:10px;color:#ffdcab}.error{color:#ffaaa9}.empty{text-align:center;padding:40px 15px;color:#b9b0ca}.footer{margin-top:40px;font-size:12px;color:#a49ab5}.footer a{color:#cba8ff}.modal{position:fixed;inset:0;background:#090810dc;z-index:10;overflow:auto;padding:18px}.modal-inner{max-width:850px;margin:25px auto;background:#1b1a28;border:1px solid #4d415e;border-radius:20px;padding:22px}.close{float:right}.section{margin-top:25px}.listrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #353044}.listrow img{width:48px;height:72px;object-fit:cover;border-radius:7px}.listrow .grow{flex:1;min-width:0}.listrow strong{display:block}.listrow small{display:block}.checklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:9px}.checklist label{padding:10px;background:#262233;border-radius:9px}.checklist input{accent-color:#ae7cff}.upcoming{border-left:3px solid #a877fa;padding:8px 13px;margin:9px 0;background:#242032;border-radius:0 9px 9px 0}@media(max-width:560px){.detail{grid-template-columns:95px 1fr;gap:12px}.detail .poster{max-width:95px}.shell{padding:18px 13px 90px}.hero h2{font-size:25px}.modal-inner{padding:15px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><div class="shell"><header><div><div class="eyebrow">Your personal watch universe</div><h1>✦ My TV Tracker</h1></div><button class="btn alt tiny" id="settingsBtn">⚙ Settings</button></header><nav class="tabs" id="tabs"><button data-tab="home" class="active">Home</button><button data-tab="discover">Discover</button><button data-tab="archive">Rediscover</button><button data-tab="shows">My Shows</button><button data-tab="upcoming">Upcoming</button><button data-tab="lists">Lists</button><button data-tab="stats">Stats</button></nav><main id="main"></main><footer class="footer">TV information and images provided by <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a>. This product uses the TMDB API but is not endorsed or certified by TMDB. Your tracking data is saved locally in this browser.</footer></div><div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-inner"><button class="btn alt tiny close" id="closeModal">✕ Close</button><div id="modalContent"></div></div></div><script>
'use strict';const K='mytv-v1',API='https://api.themoviedb.org/3',IMG='https://image.tmdb.org/t/p/w342';let db=load(),tab='home',filter='All',searchResults=[],searchText='',searchError='',detailCache={},archiveResults=[],archivePage=1,archiveDecade='2000',archiveCountry='US',archiveGenre='',archiveStatus='all',archiveBusy=false;function load(){try{return Object.assign({key:'',shows:{},lists:[]},JSON.parse(localStorage.getItem(K)||'{}'))}catch{return {key:'',shows:{},lists:[]}}}function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch{alert('Browser storage is full or unavailable. Export a backup from Settings.')}}const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),poster=p=>p?IMG+p:'',pic=(p,alt='TV poster')=>p?`<img class="poster" src="${poster(p)}" alt="${esc(alt)}" loading="lazy">`:'<div class="poster placeholder">No poster</div>',shows=()=>Object.values(db.shows),idkey=(s,e)=>`${s}:${e}`,watched=x=>Object.values(x.watched||{}).filter(Boolean).length,total=x=>Object.values(x.seasons||{}).reduce((n,s)=>n+s.length,0),percent=x=>total(x)?Math.round(100*watched(x)/total(x)):0,fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'TBA';function api(path){if(!db.key)throw Error('Add your free TMDB API Read Access Token in Settings first.');return fetch(API+path+(path.includes('?')?'&':'?')+'language=en-US',{headers:{Authorization:'Bearer '+db.key}}).then(async r=>{if(!r.ok)throw Error(r.status===401?'TMDB token not accepted. Check Settings.':`TMDB request failed (${r.status}).`);return r.json()})}function setTab(t){tab=t;$('#tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}$('#tabs').onclick=e=>{let b=e.target.closest('button[data-tab]');if(b)setTab(b.dataset.tab)};$('#settingsBtn').onclick=settings;$('#closeModal').onclick=close;$('#modal').onclick=e=>{if(e.target.id==='modal')close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});function modal(html){$('#modalContent').innerHTML=html;$('#modal').classList.remove('hidden')}function close(){$('#modal').classList.add('hidden');$('#modalContent').innerHTML=''}function card(x){return `<article class="tile">${pic(x.poster_path||x.poster,x.name)}<h3>${esc(x.name)}</h3><p>${esc((x.first_air_date||'').slice(0,4))} ${db.shows[x.id]?'· '+esc(db.shows[x.id].status):''}</p><button class="btn tiny" data-detail="${x.id}">${db.shows[x.id]?'View show':'View / Add'}</button></article>`}function render(){let m=$('#main');if(tab==='home'){let a=shows(),current=a.filter(x=>x.status==='Watching');m.innerHTML=`<div class="panel hero"><div class="eyebrow">Welcome back</div><h2>Your next episode awaits.</h2><p>Keep every show, season and episode in one place.</p><button class="btn" data-go="discover">+ Find a show</button></div><div class="stats"><div class="stat"><strong>${a.length}</strong><span>Shows saved</span></div><div class="stat"><strong>${a.reduce((n,x)=>n+watched(x),0)}</strong><span>Episodes watched</span></div><div class="stat"><strong>${current.length}</strong><span>Currently watching</span></div></div><section class="section"><h2>Continue watching</h2>${current.length?`<div class="grid">${current.map(card).join('')}</div>`:'<div class="empty">Nothing here yet. Search for a show to begin.</div>'}</section><section class="section"><h2>Recently added</h2><div class="grid">${a.slice().sort((a,b)=>b.added-a.added).slice(0,6).map(card).join('')}</div></section>`}else if(tab==='discover'){m.innerHTML=`<h2>Discover TV</h2><p>Search the TMDB catalogue to find your next show.</p><form id="searchForm" class="row"><input class="field" style="flex:1;min-width:170px;margin:0" id="searchInput" placeholder="Search for a TV show…" value="${esc(searchText)}" required><button class="btn" type="submit">Search</button></form>${!db.key?'<p class="notice">To search, open Settings and add your free TMDB API Read Access Token.</p>':''}${searchError?`<p class="error">${esc(searchError)}</p>`:''}<div class="grid section">${searchResults.map(card).join('')}</div>`;$('#searchForm').onsubmit=async e=>{e.preventDefault();searchText=$('#searchInput').value.trim();if(!searchText)return;searchError='';m.insertAdjacentHTML('beforeend','<p id="loading">Searching…</p>');try{searchResults=(await api('/search/tv?query='+encodeURIComponent(searchText)+'&include_adult=false')).results||[]}catch(err){searchError=err.message;searchResults=[]}render()}}else if(tab==='archive'){m.innerHTML=`<div class="panel hero"><div class="eyebrow">Your lifetime TV archive</div><h2>Rediscover the shows you remember.</h2><p>Browse every decade, with 2000s onward as your starting point. US and UK first, with worldwide discovery too. Older shows can be saved without guessing episode counts.</p></div><div class="panel"><div class="row"><label>Decade<select class="field" id="archiveDecade"><option value="all" ${archiveDecade==='all'?'selected':''}>All decades</option>${['1950','1960','1970','1980','1990','2000','2010','2020'].map(y=>`<option value="${y}" ${archiveDecade===y?'selected':''}>${y}s</option>`).join('')}</select></label><label>Origin<select class="field" id="archiveCountry">${[['US','United States'],['GB','United Kingdom'],['all','Worldwide']].map(([v,t])=>`<option value="${v}" ${archiveCountry===v?'selected':''}>${t}</option>`).join('')}</select></label><label>Genre<select class="field" id="archiveGenre">${[['','All genres'],['18','Drama'],['35','Comedy'],['80','Crime'],['10765','Sci-fi & fantasy'],['9648','Mystery'],['10759','Action & adventure'],['10764','Reality'],['10766','Soap'],['10751','Family'],['99','Documentary']].map(([v,t])=>`<option value="${v}" ${archiveGenre===v?'selected':''}>${t}</option>`).join('')}</select></label><label>Show status<select class="field" id="archiveStatus">${[['all','All'],['ended','Ended / concluded'],['canceled','Cancelled'],['returning','Returning']].map(([v,t])=>`<option value="${v}" ${archiveStatus===v?'selected':''}>${t}</option>`).join('')}</select></label></div><button class="btn" id="archiveFind">Browse shows</button><p class="notice">Results are from TMDB. Status labels depend on TMDB records. Shows that began before 2000 remain discoverable through All decades or their original decade. Search by name in Discover at any time.</p></div>${archiveResults.length?`<h3>Archive results</h3><div class="grid">${archiveResults.map(card).join('')}</div><p><button class="btn alt" id="archiveMore" ${archiveBusy?'disabled':''}>Load more</button></p>`:'<div class="empty">Choose your filters and tap Browse shows to start rediscovering.</div>'}`;$('#archiveFind').onclick=()=>archiveFetch(true);if($('#archiveMore'))$('#archiveMore').onclick=()=>archiveFetch(false)}else if(tab==='shows'){let a=shows().filter(x=>filter==='All'||x.status===filter);m.innerHTML=`<h2>My Shows <small>(${shows().length})</small></h2><div class="chips">${['All','Watching','Want to Watch','Completed','On Hold','Dropped'].map(s=>`<button data-filter="${esc(s)}" class="${filter===s?'active':''}">${s}</button>`).join('')}</div>${a.length?`<div class="grid">${a.map(card).join('')}</div>`:'<div class="empty">No shows in this category yet.</div>'}`}else if(tab==='upcoming'){let ev=[];for(let x of shows())for(let [s,eps] of Object.entries(x.seasons||{}))for(let e of eps)if(e.air_date&&e.air_date>=new Date().toISOString().slice(0,10)&&!x.watched[idkey(s,e.episode_number)])ev.push({x,s,e});ev.sort((a,b)=>a.e.air_date.localeCompare(b.e.air_date));m.innerHTML=`<h2>Upcoming episodes</h2><p>Known future air dates for shows in your collection. Open a show to refresh its season information.</p>${ev.length?ev.slice(0,60).map(({x,s,e})=>`<div class="upcoming"><strong>${esc(x.name)}</strong> · S${s} E${e.episode_number}<br>${esc(e.name)}<br><small>${fmt(e.air_date)}</small></div>`).join(''):'<div class="empty">No upcoming episodes found in your saved show data.</div>'}`}else if(tab==='lists'){m.innerHTML=`<h2>Custom collections</h2><form id="listForm" class="row"><input id="listName" class="field" style="flex:1;min-width:170px;margin:0" placeholder="e.g. Comfort shows" maxlength="60" required><button class="btn">Create list</button></form>${db.lists.map(l=>`<div class="panel"><div class="row between"><h3>${esc(l.name)} <small>(${l.ids.length})</small></h3><button class="btn alt tiny" data-delete-list="${l.id}">Delete</button></div>${l.ids.map(id=>db.shows[id]?`<div class="listrow">${db.shows[id].poster?`<img src="${poster(db.shows[id].poster)}" alt="">`:''}<div class="grow"><strong>${esc(db.shows[id].name)}</strong></div><button class="btn tiny alt" data-detail="${id}">Open</button></div>`:'').join('')||'<p>No shows yet. Add them from a show page.</p>'}</div>`).join('')}`;$('#listForm').onsubmit=e=>{e.preventDefault();let name=$('#listName').value.trim();if(name){db.lists.push({id:String(Date.now()),name,ids:[]});save();render()}}}else if(tab==='stats'){let a=shows(),ratings=a.filter(x=>x.rating>0);m.innerHTML=`<h2>Your watching statistics</h2><div class="stats"><div class="stat"><strong>${a.length}</strong><span>Total shows</span></div><div class="stat"><strong>${a.reduce((n,x)=>n+watched(x),0)}</strong><span>Episodes watched</span></div><div class="stat"><strong>${a.filter(x=>x.status==='Completed').length}</strong><span>Completed shows</span></div><div class="stat"><strong>${ratings.length?(ratings.reduce((n,x)=>n+Number(x.rating),0)/ratings.length).toFixed(1):'—'}</strong><span>Average rating / 10</span></div></div><div class="panel"><h3>By watch status</h3>${['Watching','Want to Watch','Completed','On Hold','Dropped'].map(s=>`<div class="row between"><span>${s}</span><strong>${a.filter(x=>x.status===s).length}</strong></div>`).join('')}</div><div class="panel"><h3>Lifetime archive</h3><div class="row between"><span>Shows with historical viewing recorded</span><strong>${a.filter(x=>x.history).length}</strong></div><div class="row between"><span>Entire series remembered</span><strong>${a.filter(x=>x.history==='all').length}</strong></div><div class="row between"><span>Watched, amount unknown</span><strong>${a.filter(x=>x.history==='unsure').length}</strong></div><h3>Shows by premiere decade</h3>${[1950,1960,1970,1980,1990,2000,2010,2020].map(y=>`<div class="row between"><span>${y}s</span><strong>${a.filter(x=>Number((x.first_air_date||'').slice(0,4))>=y&&Number((x.first_air_date||'').slice(0,4))<y+10).length}</strong></div>`).join('')}<p><small>Decades refer to premiere dates, not the years you watched.</small></p></div><div class="panel"><h3>Episodes by show</h3>${a.filter(x=>total(x)).sort((a,b)=>watched(b)-watched(a)).map(x=>`<div class="row between"><span>${esc(x.name)}</span><small>${watched(x)}/${total(x)} · ${percent(x)}%</small></div><div class="progress"><div style="width:${percent(x)}%"></div></div>`).join('')||'<p>Start tracking episodes to see progress.</p>'}</div>`}}$('#main').onclick=e=>{let d=e.target.closest('[data-detail]'),g=e.target.closest('[data-go]'),f=e.target.closest('[data-filter]'),del=e.target.closest('[data-delete-list]');if(d)openShow(Number(d.dataset.detail));if(g)setTab(g.dataset.go);if(f){filter=f.dataset.filter;render()}if(del&&confirm('Delete this collection?')){db.lists=db.lists.filter(l=>l.id!==del.dataset.deleteList);save();render()}};async function archiveFetch(reset){archiveDecade=$('#archiveDecade').value;archiveCountry=$('#archiveCountry').value;archiveGenre=$('#archiveGenre').value;archiveStatus=$('#archiveStatus').value;if(reset){archivePage=1;archiveResults=[]}if(archiveBusy)return;archiveBusy=true;let b=$('#archiveFind');b.disabled=true;b.textContent='Finding shows…';try{let params=new URLSearchParams({sort_by:'popularity.desc',page:String(archivePage),include_adult:'false'});if(archiveDecade!=='all'){params.set('first_air_date.gte',archiveDecade+'-01-01');params.set('first_air_date.lte',(Number(archiveDecade)+9)+'-12-31')}if(archiveCountry!=='all')params.set('with_origin_country',archiveCountry);if(archiveGenre)params.set('with_genres',archiveGenre);if(archiveStatus!=='all')params.set('with_status',archiveStatus);let data=await api('/discover/tv?'+params);archiveResults.push(...(data.results||[]));archivePage++;render()}catch(err){alert(err.message)}finally{archiveBusy=false;if($('#archiveFind')){$('#archiveFind').disabled=false;$('#archiveFind').textContent='Browse shows'}}}function settings(){modal(`<h2>Settings</h2><p>Get a free TMDB API Read Access Token from <a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener" style="color:#cba8ff">TMDB API settings</a>. Sign in, request API access and paste the long read-access token here (not the short API key).</p><label for="token">TMDB API Read Access Token</label><input class="field" type="password" id="token" autocomplete="off" value="${esc(db.key)}" placeholder="eyJ…"><button class="btn" id="saveToken">Save token</button><p class="notice">This personal version stores the token in your browser. Don't share your configured HTML file or use this approach for a public app.</p><h3>Back up your data</h3><p>Export your watchlists and progress before clearing browser data or switching devices.</p><div class="row"><button class="btn alt" id="export">Export JSON backup</button><label class="btn alt" for="import">Import backup</label><input id="import" type="file" accept="application/json,.json" class="hidden"></div><p><button class="btn outline" id="clearToken">Remove saved token</button></p>`);$('#saveToken').onclick=()=>{db.key=$('#token').value.trim();save();close();render()};$('#clearToken').onclick=()=>{db.key='';save();close();render()};$('#export').onclick=()=>{let copy={...db,key:''},blob=new Blob([JSON.stringify(copy,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-tv-tracker-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#import').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let d=JSON.parse(await file.text());if(!d||typeof d.shows!=='object'||!Array.isArray(d.lists))throw Error('Invalid backup format');if(!confirm('Replace your current tracking data with this backup?'))return;db={key:db.key,shows:d.shows,lists:d.lists};save();close();render()}catch(err){alert(err.message)}}}async function openShow(id){modal('<h2>Loading show…</h2>');try{let d=await api('/tv/'+id+'?append_to_response=watch/providers');detailCache[id]=d;showDetail(d)}catch(err){modal(`<h2>Could not load show</h2><p class="error">${esc(err.message)}</p>`)}}function showDetail(d){let x=db.shows[d.id],providers=d['watch/providers']?.results?.GB?.flatrate||[];modal(`<div class="detail">${pic(d.poster_path,d.name)}<div><div class="eyebrow">${esc(d.first_air_date?.slice(0,4)||'TV series')} · ${d.number_of_seasons||0} seasons</div><h2>${esc(d.name)}</h2><p>${esc(d.overview||'No synopsis available.')}</p><small>${esc((d.genres||[]).map(g=>g.name).join(' · '))}</small><p><small>Streaming in UK (TMDB): ${esc(providers.map(p=>p.provider_name).join(', ')||'Not listed')}</small></p>${!x?'<button class="btn" id="addShow">+ Add to my shows</button>':'<span class="eyebrow">✓ In your collection</span>'}</div></div><div id="showControls">${x?controls(d,x):''}</div>`);if(!x)$('#addShow').onclick=()=>{db.shows[d.id]={id:d.id,name:d.name,poster:d.poster_path,first_air_date:d.first_air_date,status:'Want to Watch',platform:'',rating:0,review:'',watched:{},seasons:{},added:Date.now(),history:'',historyWhen:'',historyNotes:'',historySeasons:[],origin_country:d.origin_country||[],original_language:d.original_language||'',tmdbStatus:d.status||''};save();showDetail(d);render()};else wireControls(d,x)}function controls(d,x){return `<section class="section"><div class="stats"><div class="stat"><strong>${percent(x)}%</strong><span>Complete</span></div><div class="stat"><strong>${watched(x)}/${total(x)}</strong><span>Episodes watched / loaded</span></div></div><div class="progress"><div style="width:${percent(x)}%"></div></div><label>Watch status<select id="status" class="field">${['Watching','Want to Watch','Completed','On Hold','Dropped'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></label><div class="panel"><h3>My viewing history</h3><p>Record older shows without ticking off episodes you can’t remember. This is separate from your precise episode progress.</p><label>What do you remember?<select id="history" class="field">${[['','Not recorded'],['all','Watched the entire series'],['some','Watched some of it'],['seasons','Watched specific seasons'],['unsure','Watched it, amount unknown'],['rewatch','Currently rewatching']].map(([v,t])=>`<option value="${v}" ${(x.history||'')===v?'selected':''}>${t}</option>`).join('')}</select></label><label>Approximately when did I watch it?<input id="historyWhen" class="field" placeholder="e.g. 2006–2009, university, years ago" value="${esc(x.historyWhen||'')}"></label><label>Seasons I remember watching<input id="historySeasons" class="field" placeholder="e.g. 1, 2, 3 (optional)" value="${esc((x.historySeasons||[]).join(', '))}"></label><label>Memory / nostalgia notes<textarea id="historyNotes" class="field" placeholder="Where I watched it, who I watched with, favourite characters…">${esc(x.historyNotes||'')}</textarea></label><small>Historical viewing does not automatically mark episodes watched or inflate episode statistics.</small></div><label>Where I'm watching<input id="platform" class="field" placeholder="e.g. Netflix, BBC iPlayer" value="${esc(x.platform)}"></label><label>My rating / 10<select id="rating" class="field"><option value="0">Not rated</option>${Array.from({length:10},(_,i)=>`<option value="${i+1}" ${Number(x.rating)===i+1?'selected':''}>${i+1}/10</option>`).join('')}</select></label><label>My review / notes<textarea id="review" class="field" placeholder="What did you think?">${esc(x.review)}</textarea></label><button class="btn" id="saveDetails">Save my details</button><h3 class="section">Custom collections</h3><div class="checklist">${db.lists.map(l=>`<label><input type="checkbox" data-list="${l.id}" ${l.ids.includes(x.id)?'checked':''}> ${esc(l.name)}</label>`).join('')||'<p>Create a collection in the Lists tab.</p>'}</div><h3 class="section">Seasons & episodes</h3><p>Load seasons individually to see episode details and track progress. Specials are excluded.</p>${(d.seasons||[]).filter(s=>s.season_number>0).map(s=>`<div class="panel"><div class="row between"><strong>${esc(s.name)} <small>(${s.episode_count} episodes)</small></strong><button class="btn tiny alt" data-season="${s.season_number}">${x.seasons[s.season_number]?'Refresh':'Load episodes'}</button></div><div id="season-${s.season_number}">${x.seasons[s.season_number]?episodeHTML(x,s.season_number):''}</div></div>`).join('')}<button class="btn outline" id="removeShow">Remove show from tracker</button></section>`}function episodeHTML(x,s){let eps=x.seasons[s]||[];return `<div class="row between"><small>${eps.filter(e=>x.watched[idkey(s,e.episode_number)]).length}/${eps.length} watched</small><button class="btn tiny alt" data-all="${s}">Mark season watched</button></div>${eps.map(e=>`<div class="episode"><input type="checkbox" id="ep-${s}-${e.episode_number}" data-ep="${s}:${e.episode_number}" ${x.watched[idkey(s,e.episode_number)]?'checked':''}><label for="ep-${s}-${e.episode_number}"><strong>${e.episode_number}. ${esc(e.name||'Episode '+e.episode_number)}</strong><small>${fmt(e.air_date)}${e.runtime?' · '+e.runtime+' min':''}</small>${e.overview?`<small>${esc(e.overview)}</small>`:''}</label></div>`).join('')}`}function wireControls(d,x){$('#saveDetails').onclick=()=>{x.status=$('#status').value;x.platform=$('#platform').value.trim();x.rating=Number($('#rating').value);x.review=$('#review').value;x.history=$('#history').value;x.historyWhen=$('#historyWhen').value.trim();x.historyNotes=$('#historyNotes').value;x.historySeasons=$('#historySeasons').value.split(',').map(v=>Number(v.trim())).filter(v=>Number.isInteger(v)&&v>0);save();showDetail(d);render()};$('#showControls').onchange=e=>{let l=e.target.dataset.list,ep=e.target.dataset.ep;if(l){let list=db.lists.find(z=>z.id===l);if(list){list.ids=e.target.checked?[...new Set([...list.ids,x.id])]:list.ids.filter(id=>id!==x.id);save()}}if(ep){x.watched[ep]=e.target.checked;save();let scroll=$('#modal').scrollTop;showDetail(d);$('#modal').scrollTop=scroll;render()}};$('#showControls').onclick=async e=>{let s=e.target.closest('[data-season]'),a=e.target.closest('[data-all]');if(s){let n=Number(s.dataset.season);s.disabled=true;s.textContent='Loading…';try{let data=await api('/tv/'+d.id+'/season/'+n);x.seasons[n]=(data.episodes||[]).map(e=>({episode_number:e.episode_number,name:e.name,air_date:e.air_date,overview:e.overview,runtime:e.runtime}));save();let scroll=$('#modal').scrollTop;showDetail(d);$('#modal').scrollTop=scroll;render()}catch(err){alert(err.message);s.disabled=false;s.textContent='Try again'}}if(a){let n=Number(a.dataset.all);for(let e of x.seasons[n]||[])x.watched[idkey(n,e.episode_number)]=true;save();let scroll=$('#modal').scrollTop;showDetail(d);$('#modal').scrollTop=scroll;render()}};$('#removeShow').onclick=()=>{if(confirm('Remove this show and its saved episode progress?')){delete db.shows[x.id];db.lists.forEach(l=>l.ids=l.ids.filter(id=>id!==x.id));save();close();render()}}}
const ARCHIVE_GENRES=[['','All genres'],['18','Drama'],['35','Comedy'],['80','Crime'],['9648','Mystery'],['10765','Sci-Fi & Fantasy'],['10759','Action & Adventure'],['10766','Soap'],['10764','Reality'],['99','Documentary'],['10751','Family']];
const ARCHIVE_NETWORKS=[['','All networks'],['49','HBO'],['67','Showtime'],['2','ABC'],['6','NBC'],['16','CBS'],['19','FOX'],['71','The CW'],['213','Netflix'],['4','BBC One'],['9','BBC Two'],['332','BBC Three'],['26','Channel 4'],['149','ITV1'],['1024','Amazon Prime Video']];
function archiveSelect(name,items){return `<label>${name}<select class="field" data-archive="${name}">${items.map(([v,t])=>`<option value="${esc(v)}" ${String(archiveFilters[name])===String(v)?'selected':''}>${esc(t)}</option>`).join('')}</select></label>`}
function renderArchive(m){m.innerHTML=`<div class="panel hero"><div class="eyebrow">Your lifetime TV archive</div><h2>Rediscover what you watched.</h2><p>Browse any decade, with 2000s onward as the starting point. Add a show, then record what you remember without ticking every episode.</p></div><div class="panel"><div class="archive-filters">${archiveSelect('decade',[['all','All decades'],...Array.from({length:9},(_,i)=>[String(1950+i*10),String(1950+i*10)+'s'])])}${archiveSelect('country',[['US','United States'],['GB','United Kingdom'],['all','All countries']])}${archiveSelect('language',[['en','English original language'],['all','All languages']])}${archiveSelect('status',[['all','All statuses'],['ended','Ended (includes many cancelled shows)'],['returning','Returning series']])}${archiveSelect('genre',ARCHIVE_GENRES)}${archiveSelect('network',ARCHIVE_NETWORKS)}</div><button class="btn" id="browseArchive" ${archiveBusy?'disabled':''}>${archiveBusy?'Loading…':'Browse shows'}</button><p><small>TMDB does not reliably distinguish cancelled from naturally concluded series. “Ended” includes both. Results are ordered by popularity, not a complete historical index. Shows that began before a selected decade but continued into it may be found via All decades or search.</small></p></div>${archiveError?`<p class="error">${esc(archiveError)}</p>`:''}<div class="row between section"><h2>Browse results</h2><small>Page ${archivePage} of ${archivePages}</small></div>${archiveResults.length?`<div class="grid">${archiveResults.map(card).join('')}</div><div class="row section"><button class="btn alt" id="archiveMore" ${archiveBusy||archivePage>=archivePages?'disabled':''}>${archiveBusy?'Loading…':'Load more'}</button></div>`:'<div class="empty">Choose your filters and tap Browse shows.</div>'}`;m.querySelectorAll('[data-archive]').forEach(el=>el.onchange=()=>{archiveFilters[el.dataset.archive]=el.value});$('#browseArchive').onclick=()=>fetchArchive(false);if($('#archiveMore'))$('#archiveMore').onclick=()=>fetchArchive(true)}
async function fetchArchive(more){if(archiveBusy)return;archiveBusy=true;archiveError='';if(!more){archivePage=1;archiveResults=[]}render();try{let f=archiveFilters,q=new URLSearchParams({sort_by:'popularity.desc',include_adult:'false',page:String(archivePage),watch_region:'GB'});if(f.decade!=='all'){q.set('first_air_date.gte',f.decade+'-01-01');q.set('first_air_date.lte',String(Number(f.decade)+9)+'-12-31')}if(f.country!=='all')q.set('with_origin_country',f.country);if(f.language!=='all')q.set('with_original_language',f.language);if(f.status==='ended')q.set('with_status','3');if(f.status==='returning')q.set('with_status','0');if(f.genre)q.set('with_genres',f.genre);if(f.network)q.set('with_networks',f.network);let data=await api('/discover/tv?'+q.toString());archiveResults=more?[...archiveResults,...(data.results||[])]:data.results||[];archivePages=Math.min(data.total_pages||1,500)}catch(e){archiveError=e.message;if(more)archivePage--}finally{archiveBusy=false;render()}}
render();
</script></body></html>
